.logo{opacity:0;animation:ln .8s ease-out 1.2s forwards}
.scan{animation:sc 5s linear infinite} @keyframes sc{from{transform:translateY(40px)}to{transform:translateY(600px)}}
.cur{opacity:0;animation:ap 0s 3.46s forwards, bl 1s steps(1) 3.46s infinite} @keyframes ap{to{opacity:1}}
