<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace">
<style>
.blink{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.ln{opacity:0;animation:ln .35s ease-out forwards} @keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.type{animation:ty .9s steps(18) .4s both} @keyframes ty{from{width:0}to{width:183.6px}}
